# 日本語ロケール定義（Rails I18n 用）
# - 画面表示やバリデーションエラーメッセージの日本語文言を管理します。
# - モデル名/属性名の日本語化、エラーメッセージの上書きが可能です。
# - 例: I18n.t('activerecord.models.movie')、User.human_attribute_name(:email)
ja:
  errors:
    messages:
      blank: "入力してください"
      taken: "すでに使用されています"
      invalid: "は不正な値です"
      confirmation: "と一致しません"
      inclusion: "は一覧にありません"
      required: "を入力してください"
  activerecord:
    models:
      schedule: スケジュール
      movie: 映画
      theater: 劇場
      screen: スクリーン
    attributes:
      schedule:
        movie: 作品
        movie_id: 作品ID
        screen: スクリーン
        screen_id: スクリーンID
        start_time: 開始時刻
        end_time: 終了時刻
      movie:
        running_minutes: 上映時間（分）
      screen:
        theater: 劇場
        theater_id: 劇場
    errors:
      models:
        schedule:
          attributes:
            screen:
              required: "^スクリーンを選択してください"
            movie:
              required: "^作品を選択してください"
            movie_id:
              required: "^作品を選択してください"
            start_time:
              blank: "^開始時刻を入力してください"
            end_time:
              blank: "^終了時刻を入力してください"
        movie:
          attributes:
            running_minutes:
              greater_than: "^上映時間は1分以上で入力してください"
        sheet:
          attributes:
            screen:
              required: "^スクリーンを入力してください"
